<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Analyst Control Deck • Admin Authentication</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <link rel="stylesheet" href="/css/style.css">
</head>
<body class="bg-[#030712] text-slate-100 min-h-screen flex items-center justify-center p-4 relative overflow-hidden font-body">

  <canvas id="antigravity-canvas"></canvas>
  <div class="cosmic-glow-blob blob-1"></div>
  <div class="cosmic-glow-blob blob-2"></div>

  <div class="glass-panel rounded-3xl p-8 sm:p-10 max-w-md w-full relative z-10 border border-cyan-500/30 shadow-2xl float-element-slow">
    
    <div class="text-center space-y-3 mb-8">
      <div class="w-16 h-16 mx-auto rounded-2xl bg-gradient-to-tr from-cyan-500 to-purple-600 flex items-center justify-center text-white text-2xl shadow-lg shadow-cyan-500/40">
        <i class="fas fa-chart-pie"></i>
      </div>
      <div>
        <span class="text-[11px] font-mono uppercase tracking-widest text-cyan-400">Zero-G Telemetry Hub</span>
        <h1 class="text-2xl font-heading font-extrabold text-white mt-1">Data Analyst Deck</h1>
      </div>
      <p class="text-xs text-slate-400">Enter access credentials to inspect live visitor analytics and pipeline telemetry.</p>
    </div>

    {% if error %}
    <div class="mb-5 p-3.5 rounded-xl bg-rose-500/20 border border-rose-500/40 text-rose-300 text-xs font-mono flex items-center gap-2">
      <i class="fas fa-triangle-exclamation"></i>
      <span>{{ error }}</span>
    </div>
    {% endif %}

    <form method="POST" action="/admin/login" class="space-y-4">
      <div class="space-y-1.5">
        <label class="text-xs font-mono text-slate-300 block">Operator Username</label>
        <div class="relative">
          <span class="absolute inset-y-0 left-0 flex items-center pl-3.5 text-slate-500">
            <i class="fas fa-user-astronaut text-sm"></i>
          </span>
          <input type="text" name="username" required placeholder="admin" value="admin" class="w-full pl-10 pr-4 py-2.5 rounded-xl bg-slate-950/80 border border-slate-800 text-sm text-white focus:outline-none focus:border-cyan-400 focus:ring-1 focus:ring-cyan-400 transition placeholder:text-slate-600">
        </div>
      </div>

      <div class="space-y-1.5">
        <label class="text-xs font-mono text-slate-300 block">Security Key</label>
        <div class="relative">
          <span class="absolute inset-y-0 left-0 flex items-center pl-3.5 text-slate-500">
            <i class="fas fa-key text-sm"></i>
          </span>
          <input type="password" name="password" required placeholder="antigravity2024" value="antigravity2024" class="w-full pl-10 pr-4 py-2.5 rounded-xl bg-slate-950/80 border border-slate-800 text-sm text-white focus:outline-none focus:border-cyan-400 focus:ring-1 focus:ring-cyan-400 transition placeholder:text-slate-600">
        </div>
      </div>

      <button type="submit" class="w-full py-3 px-6 rounded-xl font-heading font-bold text-sm tracking-wide bg-gradient-to-r from-cyan-400 to-purple-600 text-slate-950 hover:shadow-lg hover:shadow-cyan-500/30 transition flex items-center justify-center gap-2 mt-2">
        <span>Authorize Session</span>
        <i class="fas fa-shield-halved text-xs"></i>
      </button>
    </form>

    <div class="mt-6 pt-4 border-t border-slate-800 text-center">
      <a href="/" class="text-xs font-mono text-slate-400 hover:text-cyan-400 transition flex items-center justify-center gap-1.5">
        <i class="fas fa-arrow-left text-[10px]"></i>
        <span>Return to Portfolio Orbit</span>
      </a>
    </div>

  </div>

  <script src="/js/particles.js"></script>
</body>
</html>
